<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1380" viewBox="0 0 1460 1380" role="img" aria-labelledby="title desc">
<title id="title">MSG CTF 플랫폼 전체 구성</title>
<desc id="desc">내부·외부 Frontend와 Backend, PostgreSQL과 Redis를 분리합니다 스케줄러는 브로커의 자원 예약을 거쳐 런타임에 생성을 요청합니다 KOTH 경기와 트랙별 백엔드 채점, Windows 실행 경로, 문제 CI·GHCR·발행본과 백엔드 릴리스 저장, SLA 감시를 함께 보여줍니다 현재 정상 상태나 노드 수를 표시하는 그림은 아닙니다</desc>
